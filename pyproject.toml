[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-connector-bitbucket"
version = "0.1.0"
description = "Governed URI process connector for Bitbucket Cloud"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "urirun>=0.4.14",
  "urirun-connector-forge @ git+https://github.com/urirun-connectors/urirun-connector-forge.git@main",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
urirun-connector-bitbucket = "urirun_connector_bitbucket.core:main"

[tool.setuptools.package-data]
urirun_connector_bitbucket = ["connector.manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
